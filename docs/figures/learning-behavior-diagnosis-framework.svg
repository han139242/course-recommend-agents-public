<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF4FB"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E9F2FF"/>
      <stop offset="1" stop-color="#DCE8F7"/>
    </linearGradient>
    <linearGradient id="panelMint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ECF8F3"/>
      <stop offset="1" stop-color="#D8EEE5"/>
