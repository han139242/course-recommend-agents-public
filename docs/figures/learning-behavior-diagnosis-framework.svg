      .section { font: 700 28px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #111827; }
      .label { font: 600 20px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #18263A; }
      .small { font: 500 17px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #334155; }
      .tiny { font: 500 15px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #475569; }
      .note { font: 700 18px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #284766; }
