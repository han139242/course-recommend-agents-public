[project]
name = "txt2neo4j"
version = "0.1.0"
description = "Industrial-style TXT to Neo4j extraction pipeline for AI course knowledge graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=5.28.1",
  "pydantic>=2.11.3",
  "python-dotenv>=1.1.0",
]

[project.scripts]
txt2neo4j = "txt2neo4j.cli:main"
txt2neo4j-normalize = "txt2neo4j.normalize_graph:main"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
