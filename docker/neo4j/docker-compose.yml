services:
  neo4j:
    image: neo4j:5.26-community
    container_name: course-recommend-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-please-change-me} 'RETURN 1;'"]
      interval: 10s
      timeout: 10s
      retries: 20

  neo4j-import:
    image: neo4j:5.26-community
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-please-change-me}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      SEED_FILE: /seed/knowledge_graph_seed.cypher
    volumes:
      - ../../db/neo4j/bootstrap:/seed:ro
      - ./import/import.sh:/import/import.sh:ro
    entrypoint: ["/bin/bash", "/import/import.sh"]
    restart: "no"

volumes:
  neo4j_data:
