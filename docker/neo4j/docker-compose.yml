# 一键拉起：MySQL + Redis + Neo4j（含图谱种子）+ 后端 API
# 用法（在仓库内）: docker compose -f docker/neo4j/docker-compose.yml --env-file docker/neo4j/.env up -d --build
# 健康检查: curl http://localhost:8080/healthz 与 http://localhost:8080/readyz

services:
  mysql:
    image: mysql:8.0
    container_name: course-recommend-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pass}
      MYSQL_DATABASE: course_recommend
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_dev_pass}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../backend/migrations/000001_create_users_and_classrooms.sql:/docker-entrypoint-initdb.d/000001.sql:ro
      - ../../backend/migrations/000002_add_unique_index_for_classrooms.sql:/docker-entrypoint-initdb.d/000002.sql:ro
      - ../../backend/migrations/000003_create_questions.sql:/docker-entrypoint-initdb.d/000003.sql:ro
      - ../../backend/migrations/000004_create_question_options.sql:/docker-entrypoint-initdb.d/000004.sql:ro
      - ../../backend/migrations/000005_create_student_answers.sql:/docker-entrypoint-initdb.d/000005.sql:ro
      - ../../backend/migrations/000006_create_learning_progress.sql:/docker-entrypoint-initdb.d/000006.sql:ro
      - ./mysql/init/000007_seed_test_data.sql:/docker-entrypoint-initdb.d/000007.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: course-recommend-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26.24
    container_name: course-recommend-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-123456789}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-123456789} 'RETURN 1;'"]
      interval: 10s
      timeout: 10s
      retries: 20

  neo4j-import:
    image: neo4j:5.26.24
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-123456789}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      SEED_FILE: /seed/knowledge_graph_seed.cypher
    volumes:
      - ../../db/neo4j/bootstrap:/seed:ro
      - ./import/import.sh:/import/import.sh:ro
    entrypoint: ["/bin/bash", "/import/import.sh"]
    restart: "no"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: course-recommend-backend:local
    container_name: course-recommend-backend
    env_file:
      - ../../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      # 与 mysql 服务中的 MYSQL_PASSWORD 保持一致（可通过 .env 覆盖）
      MYSQL_DSN: "app:${MYSQL_PASSWORD:-app_dev_pass}@tcp(mysql:3306)/course_recommend?parseTime=true&charset=utf8mb4&loc=Local"
      REDIS_ADDR: redis:6379
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-123456789}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-use-32bytes-min}
      LOG_LEVEL: info
      GRAPH_WRITER_ENABLED: "true"
    volumes:
      - ../../backend/web/dist:/app/web/dist:ro
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"

volumes:
  mysql_data:
  neo4j_data:
